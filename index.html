<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sedang Dalam Perbaikan</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #333;
            overflow: hidden;
            position: relative;
        }

        /* Animated Background */
        .bg-gradient {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #0f4c2e 0%, #1a6b3c 25%, #2d8a4e 50%, #c78c06 75%, #e6a817 100%);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
            z-index: 0;
        }

        .bg-gradient::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 50%, rgba(255,255,255,0.08) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(255,255,255,0.06) 0%, transparent 40%),
                radial-gradient(circle at 40% 80%, rgba(255,255,255,0.04) 0%, transparent 40%);
            z-index: 1;
        }

        /* Floating Particles */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .particle {
            position: absolute;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            animation: float linear infinite;
        }

        .particle:nth-child(1) { width: 6px; height: 6px; left: 10%; animation-duration: 12s; animation-delay: 0s; }
        .particle:nth-child(2) { width: 4px; height: 4px; left: 25%; animation-duration: 18s; animation-delay: 2s; }
        .particle:nth-child(3) { width: 8px; height: 8px; left: 40%; animation-duration: 14s; animation-delay: 4s; }
        .particle:nth-child(4) { width: 5px; height: 5px; left: 55%; animation-duration: 16s; animation-delay: 1s; }
        .particle:nth-child(5) { width: 7px; height: 7px; left: 70%; animation-duration: 20s; animation-delay: 3s; }
        .particle:nth-child(6) { width: 3px; height: 3px; left: 85%; animation-duration: 13s; animation-delay: 5s; }
        .particle:nth-child(7) { width: 5px; height: 5px; left: 15%; animation-duration: 17s; animation-delay: 6s; }
        .particle:nth-child(8) { width: 6px; height: 6px; left: 60%; animation-duration: 15s; animation-delay: 2s; }
        .particle:nth-child(9) { width: 4px; height: 4px; left: 90%; animation-duration: 19s; animation-delay: 4s; }
        .particle:nth-child(10) { width: 7px; height: 7px; left: 35%; animation-duration: 11s; animation-delay: 7s; }

        @keyframes float {
            0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-100vh) rotate(720deg); opacity: 0; }
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Main Container */
        .maintenance-container {
            position: relative;
            z-index: 10;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 3.5rem 3rem;
            border-radius: 24px;
            box-shadow: 
                0 25px 80px rgba(0, 0, 0, 0.25),
                0 0 0 1px rgba(255, 255, 255, 0.2),
                inset 0 1px 0 rgba(255, 255, 255, 0.5);
            text-align: center;
            max-width: 520px;
            width: 90%;
            animation: fadeInUp 1s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* Logo */
        .maintenance-logo {
            margin-bottom: 2rem;
            animation: fadeIn 1.2s ease-out 0.3s both;
        }

        .maintenance-logo img {
            max-width: 220px;
            height: auto;
            display: block;
            margin: 0 auto;
            filter: drop-shadow(0 2px 8px rgba(0,0,0,0.1));
        }

        /* Icon Area */
        .maintenance-icon {
            width: 90px;
            height: 90px;
            margin: 0 auto 2rem;
            background: linear-gradient(135deg, #0f4c2e, #2d8a4e);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: pulse 3s ease-in-out infinite, fadeIn 1s ease-out 0.5s both;
            box-shadow: 0 8px 30px rgba(45, 138, 78, 0.3);
        }

        .maintenance-icon svg {
            width: 42px;
            height: 42px;
            fill: none;
            stroke: white;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* Gear animation inside icon */
        .gear-spin {
            animation: gearRotate 8s linear infinite;
            transform-origin: center;
        }

        .gear-spin-reverse {
            animation: gearRotateReverse 6s linear infinite;
            transform-origin: center;
        }

        /* Text Styles */
        .maintenance-label {
            display: inline-block;
            background: linear-gradient(135deg, #0f4c2e, #2d8a4e);
            color: white;
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
            padding: 6px 20px;
            border-radius: 50px;
            margin-bottom: 1.2rem;
            animation: fadeIn 1s ease-out 0.7s both;
        }

        h1 {
            color: #1a1a2e;
            font-size: 2.2rem;
            font-weight: 800;
            margin-bottom: 0.3rem;
            letter-spacing: -0.5px;
            line-height: 1.2;
            animation: fadeIn 1s ease-out 0.8s both;
        }

        h2 {
            color: #2d8a4e;
            font-size: 1.3rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            animation: fadeIn 1s ease-out 0.9s both;
        }

        .message {
            color: #6b7280;
            font-size: 1rem;
            line-height: 1.8;
            margin-bottom: 2rem;
            font-weight: 400;
            animation: fadeIn 1s ease-out 1s both;
        }

        /* Progress Bar */
        .progress-wrapper {
            background: #f0f0f0;
            border-radius: 50px;
            height: 6px;
            overflow: hidden;
            margin-bottom: 2rem;
            animation: fadeIn 1s ease-out 1.1s both;
        }

        .progress-bar {
            height: 100%;
            border-radius: 50px;
            background: linear-gradient(90deg, #0f4c2e, #2d8a4e, #c78c06);
            background-size: 200% 100%;
            animation: progressMove 3s ease-in-out infinite, progressGradient 2s linear infinite;
            width: 60%;
        }

        /* Contact Info */
        .contact-info {
            background: linear-gradient(135deg, #f8faf9, #f0f5f1);
            padding: 1.5rem;
            border-radius: 16px;
            border: 1px solid rgba(45, 138, 78, 0.1);
            animation: fadeIn 1s ease-out 1.2s both;
        }

        .contact-info h3 {
            color: #1a1a2e;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
            font-weight: 600;
        }

        .contact-info p {
            color: #6b7280;
            font-size: 0.85rem;
            line-height: 1.6;
        }

        .contact-info a {
            color: #2d8a4e;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s ease;
        }

        .contact-info a:hover {
            color: #0f4c2e;
        }

        /* Animations */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(40px) scale(0.96);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); box-shadow: 0 8px 30px rgba(45, 138, 78, 0.3); }
            50% { transform: scale(1.05); box-shadow: 0 12px 40px rgba(45, 138, 78, 0.4); }
        }

        @keyframes gearRotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes gearRotateReverse {
            from { transform: rotate(0deg); }
            to { transform: rotate(-360deg); }
        }

        @keyframes progressMove {
            0% { width: 30%; }
            50% { width: 70%; }
            100% { width: 30%; }
        }

        @keyframes progressGradient {
            0% { background-position: 0% 50%; }
            100% { background-position: 200% 50%; }
        }

        /* Responsive */
        @media (max-width: 600px) {
            .maintenance-container {
                padding: 2.5rem 1.5rem;
                border-radius: 20px;
            }

            .maintenance-icon {
                width: 75px;
                height: 75px;
                margin-bottom: 1.5rem;
            }

            .maintenance-icon svg {
                width: 36px;
                height: 36px;
            }

            h1 {
                font-size: 1.7rem;
            }

            h2 {
                font-size: 1.1rem;
            }

            .message {
                font-size: 0.9rem;
            }

            .maintenance-logo img {
                max-width: 180px;
            }
        }
    </style>
</head>
<body>
    <!-- Animated Background -->
    <div class="bg-gradient"></div>

    <!-- Floating Particles -->
    <div class="particles">
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
    </div>

    <!-- Main Content -->
    <div class="maintenance-container">
        <div class="maintenance-logo">
			<img src="logo.png" />
        </div>

        <div class="maintenance-icon">
            <svg viewBox="0 0 24 24">
                <path class="gear-spin" d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"/>
                <path class="gear-spin" d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
            </svg>
        </div>

        <span class="maintenance-label">Maintenance Mode</span>

        <h1>MOHON MAAF</h1>
        <h2>Sedang Dalam Perbaikan</h2>

        <p class="message">
            Kami sedang melakukan pemeliharaan sistem untuk memberikan layanan yang lebih baik.<br>
            Silahkan kunjungi kami beberapa saat lagi.
        </p>

        <div class="progress-wrapper">
            <div class="progress-bar"></div>
        </div>

        <div class="contact-info">
            <h3>Butuh Bantuan?</h3>
            <p>Jika Anda memiliki pertanyaan mendesak, silahkan hubungi tim support kami.</p>
        </div>
    </div>
</body>
</html>
